<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .form-container {
            background-color: #ffffff;
            max-width: 400px;
            margin: 0 auto;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .gender-group label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Đăng Ký Người Dùng</h2>
        
        <!-- Form gửi dữ liệu bằng phương thức POST lên server -->
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <div class="form-group">
                <label for="name">Họ và tên:</label>
                <!-- name="name" theo yêu cầu -->
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên..." required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <!-- name="email" theo yêu cầu -->
                <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email..." required>
            </div>
            
            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <!-- name="phone" theo yêu cầu -->
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại..." required>
            </div>
            
            <div class="form-group">
                <label>Giới tính:</label>
                <!-- name="gender" theo yêu cầu -->
                <div class="gender-group">
                    <label><input type="radio" name="gender" value="Nam" checked> Nam</label>
                    <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Đăng Ký</button>
        </form>
    </div>

</body>
</html>
